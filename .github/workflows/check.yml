name: Build and checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build application
        run: SIGN_IDENTITY=- zsh build.sh
      - name: Command and localization checks
        run: zsh scripts/test.sh
